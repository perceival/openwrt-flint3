name: RTL8372N OpenWrt image build

on:
  push:
    branches: [rtl837x-dsa-port]
    paths: [.github/workflows/rtl8372n-openwrt.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  be9300-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux build host
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl autoconf automake libtool pkg-config time
          df -h .
      - name: Configure BE9300 AP image and record inputs
        run: |
          cp package/kernel/rtl837x/P0-FEEDS.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds list -s -f > p0-feeds.conf
          diff -u <(sed '/^#/d; /^$/d' feeds.conf) p0-feeds.conf
          cp configs/ap.config .config
          make defconfig
          {
            git rev-parse HEAD
            ./scripts/feeds list -s
          } > p0-build-inputs.txt
          grep -E '^CONFIG_(TARGET_qualcommbe|PACKAGE_kmod-rtl837x-dsa|PACKAGE_kmod-mdio-devres|USE_APK)' .config
          grep -qx 'CONFIG_PACKAGE_kmod-rtl837x-dsa=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-mdio-devres=y' .config
      - name: Build complete image
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee p0-openwrt-build.log
      - name: Confirm module and image artifacts
        run: |
          find build_dir -type f -name rtl8372n_dsa.ko -print | tee p0-modules.txt
          test -s p0-modules.txt
          find bin -type f \( -name '*rtl837x-dsa*.apk' -o -name '*rtl837x-dsa*.ipk' \) -print | tee p0-packages.txt
          test -s p0-packages.txt
          sha256sum bin/targets/qualcommbe/ipq53xx/*glinet_gl-be9300*sysupgrade.bin > p0-image-sha256.txt
      - name: Save configuration, logs and test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8372n-be9300-image-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .config
            p0-feeds.conf
            p0-*.txt
            p0-*.log
            logs/
            bin/targets/qualcommbe/ipq53xx/
            bin/packages/**/kmod-rtl837x-dsa*.apk
            bin/packages/**/kmod-rtl837x-dsa*.ipk
